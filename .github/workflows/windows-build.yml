name: Windows Build and Release

on:
  push:
    branches: [main, 'release/**', 'feature/**']
    tags: ['v*']
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Build and run synthetic UI regression
        shell: pwsh
        run: |
          .\tests\run-ui.ps1
      - name: Package portable Windows executable
        shell: pwsh
        run: |
          .\tools\package-release.ps1 -SkipBuild -SkipTests
      - name: Upload tested portable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UmiAchievementClaimer-windows-x64
          path: |
            dist/UmiAchievementClaimer.exe
            dist/*portable.zip
            dist/SHA256SUMS.release.txt
          if-no-files-found: error
      - name: Publish release only for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $archive = (Get-ChildItem dist\*portable.zip | Select-Object -First 1 -ExpandProperty FullName)
          gh release create "${{ github.ref_name }}" $archive `
            "dist\UmiAchievementClaimer.exe" "dist\SHA256SUMS.release.txt" `
            --title "Umi Achievement Claimer ${{ github.ref_name }}" `
            --generate-notes --verify-tag
